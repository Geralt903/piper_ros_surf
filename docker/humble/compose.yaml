services:
  piper_humble:
    image: piper-ros:humble
    container_name: piper_humble
    network_mode: host
    privileged: true
    ipc: host
    stdin_open: true
    tty: true
    working_dir: /ws/piper_ros
    environment:
      DISPLAY: ${DISPLAY:-}
      QT_X11_NO_MITSHM: "1"
    volumes:
      - ../..:/ws/piper_ros
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: bash -lc "source /opt/ros/humble/setup.bash && tail -f /dev/null"
