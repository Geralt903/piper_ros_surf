<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Piper Web Monitor</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main class="app">
      <section class="viewport" aria-label="Piper 3D 状态预览">
        <canvas id="scene"></canvas>
        <div class="hud">
          <div>
            <span class="label">ROS</span>
            <strong id="rosState">等待数据</strong>
          </div>
          <div>
            <span class="label">延迟</span>
            <strong id="age">--</strong>
          </div>
        </div>
      </section>

      <aside class="panel">
        <header>
          <h1>Piper 状态</h1>
          <div id="serviceBadge" class="badge">服务检查中</div>
        </header>

        <div class="actions">
          <button id="enableBtn" class="primary" type="button">使能</button>
          <button id="disableBtn" type="button">失能</button>
          <button id="stopCurrentBtn" class="danger wide-action" type="button">停止在当前位置</button>
        </div>

        <section class="status-grid" aria-label="机械臂状态">
          <div>
            <span>控制模式</span>
            <strong id="ctrlMode">--</strong>
          </div>
          <div>
            <span>臂状态</span>
            <strong id="armStatus">--</strong>
          </div>
          <div>
            <span>运动状态</span>
            <strong id="motionStatus">--</strong>
          </div>
          <div>
            <span>错误码</span>
            <strong id="errCode">--</strong>
          </div>
        </section>

        <section>
          <h2>关节角度</h2>
          <div id="jointList" class="joint-list"></div>
        </section>

        <section>
          <h2>末端坐标</h2>
          <div class="pose-block">
            <div>
              <span>驱动反馈</span>
              <strong id="feedbackPose">--</strong>
            </div>
            <div>
              <span>URDF 解算</span>
              <strong id="solvedPose">--</strong>
            </div>
          </div>
        </section>

        <section>
          <div class="section-head">
            <h2>MoveIt 坐标控制</h2>
            <button id="fillCurrentPoseBtn" class="small" type="button">填入当前坐标</button>
          </div>
          <div class="pose-command-grid">
            <label>x<input id="cmdX" type="number" step="0.001" value="0.250"></label>
            <label>y<input id="cmdY" type="number" step="0.001" value="0.000"></label>
            <label>z<input id="cmdZ" type="number" step="0.001" value="0.250"></label>
            <label>roll<input id="cmdRoll" type="number" step="0.001" value="0.000"></label>
            <label>pitch<input id="cmdPitch" type="number" step="0.001" value="1.570"></label>
            <label>yaw<input id="cmdYaw" type="number" step="0.001" value="0.000"></label>
            <label>gripper<input id="cmdGripper" type="number" step="0.001" value="0.000"></label>
            <label>speed<input id="cmdSpeed" type="number" step="1" min="1" max="100" value="10"></label>
          </div>
          <button id="sendMoveitPoseBtn" class="primary wide" type="button">MoveIt 解算并执行</button>
        </section>

        <section>
          <h2>当前位置微调</h2>
          <div class="jog-grid" aria-label="当前位置微调">
            <button type="button" data-jog-axis="x" data-jog-value="-0.1">X -0.1</button>
            <button type="button" data-jog-axis="x" data-jog-value="0.1">X +0.1</button>
            <button type="button" data-jog-axis="y" data-jog-value="-0.1">Y -0.1</button>
            <button type="button" data-jog-axis="y" data-jog-value="0.1">Y +0.1</button>
            <button type="button" data-jog-axis="z" data-jog-value="-0.1">Z -0.1</button>
            <button type="button" data-jog-axis="z" data-jog-value="0.1">Z +0.1</button>
          </div>
        </section>

        <section>
          <div class="section-head">
            <h2>显示校准</h2>
            <button id="zeroCurrentBtn" class="small" type="button">当前为零</button>
          </div>
          <div id="calibrationList" class="calibration-list"></div>
        </section>

        <section>
          <h2>IK 参数</h2>
          <div id="ikList" class="ik-list"></div>
        </section>

        <div class="actions">
          <button id="saveConfigBtn" class="primary" type="button">保存参数</button>
          <button id="resetConfigBtn" type="button">恢复默认</button>
        </div>

        <div id="message" class="message"></div>
      </aside>
    </main>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
          "three/examples/jsm/": "https://unpkg.com/three@0.165.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
